<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1124" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Cyan to Indigo Gradient for Glow & Accent -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="90%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGradient)" />
  <rect width="1584" height="396" fill="url(#grid)" />

  <!-- Ambient Light Glows -->
  <rect width="1584" height="396" fill="url(#cyanGlow)" />
  <rect width="1584" height="396" fill="url(#purpleGlow)" />

  <!-- Geometric Abstract Tech Accent Lines on Right -->
  <g opacity="0.4">
    <path d="M 1100 0 L 1250 396" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" />
    <path d="M 1250 0 L 1400 396" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5" stroke-dasharray="8 8" />
    <path d="M 1000 396 L 1200 0" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />
    <circle cx="1320" cy="180" r="140" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="1320" cy="180" r="80" fill="none" stroke="rgba(99, 102, 241, 0.12)" stroke-width="1" />
  </g>

  <!-- Left Side: Space for Circular Profile Photo (Avatar area) -->
  <!-- Subtle decorative indicator that blends nicely -->
  <circle cx="160" cy="200" r="130" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" stroke-dasharray="4 6" />

  <!-- Content Group (Positioned in Center & Right to remain perfectly visible on all devices) -->
  <g transform="translate(420, 65)">
    <!-- Status / Role Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <circle cx="18" cy="16" r="4.5" fill="#10b981" />
      <text x="32" y="21" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">
        ASPIRING SOFTWARE DEVELOPER
      </text>
    </g>

    <!-- Main Name -->
    <text x="0" y="85" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5" filter="url(#shadow)">
      Harshad Ayatode
    </text>

    <!-- Subtitle / Passion statement -->
    <text x="0" y="125" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      Building scalable backend systems &amp; modern web applications
    </text>

    <!-- Tech Stack Chips Row -->
    <g transform="translate(0, 155)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="80" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(56,189,248,0.25)" stroke-width="1" />
        <text x="40" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">Python</text>
      </g>
      <!-- Java / DSA -->
      <g transform="translate(90, 0)">
        <rect width="95" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(245,158,11,0.25)" stroke-width="1" />
        <text x="47" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">Java • DSA</text>
      </g>
      <!-- React.js -->
      <g transform="translate(195, 0)">
        <rect width="90" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(56,189,248,0.25)" stroke-width="1" />
        <text x="45" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">React.js</text>
      </g>
      <!-- Flask / REST APIs -->
      <g transform="translate(295, 0)">
        <rect width="135" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(129,140,248,0.25)" stroke-width="1" />
        <text x="67" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">Flask • REST APIs</text>
      </g>
      <!-- Machine Learning -->
      <g transform="translate(440, 0)">
        <rect width="145" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(236,72,153,0.25)" stroke-width="1" />
        <text x="72" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">Machine Learning</text>
      </g>
    </g>

    <!-- Footer Row: College & GitHub info -->
    <g transform="translate(0, 222)">
      <!-- Location / College -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="3" fill="#38bdf8" />
        <text x="18" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
          SVERI's College of Engineering, Pandharpur
        </text>
      </g>

      <!-- GitHub Link -->
      <g transform="translate(370, 0)">
        <text x="0" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#64748b">•</text>
        <text x="18" y="11" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#38bdf8">
          github.com/Harshad964
        </text>
      </g>
    </g>
  </g>
</svg>

